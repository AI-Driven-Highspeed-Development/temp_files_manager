[project]
name = "temp-files-manager"
version = "0.0.1"
description = "ADHD Framework manager: temp_files_manager"
requires-python = ">=3.11"
dependencies = [
    "config-manager",
    "logger-util",
]

[project.urls]
Repository = "https://github.com/AI-Driven-Highspeed-Development/temp_files_manager.git"

[tool.adhd]
type = "manager"
layer = "dev"

[tool.uv.sources]
config-manager = { workspace = true }
logger-util = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
dev-mode-dirs = [".."]
